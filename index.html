<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axisnotb</title>
<meta name="description" content="아끼는 책, 음악, 장소.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  everyday, private by default, quietly professional
   IDEA   a book's contents page: one name, a four-line index, then four short lists
   PICTURE the wordmark set very large beside the contents index (section names with counts)
   COLOUR white, ink #1d2127, graphite #69707b, rule #e4e6ea, indigo ink #2f45a8 for links and states only
   TYPE   Hahmlet (display, titles) + IBM Plex Sans KR (text, UI)
   LAYOUT 12-col; margin rail holds section name, rows on the right; phone: rail stacks on top */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15171b);--ink:light-dark(#1d2127,#e8e9ec);--mute:light-dark(#69707b,#9aa0aa);--rule:light-dark(#e4e6ea,#2a2d33);--soft:light-dark(#f5f6f8,#1c1f24);--acc:light-dark(#2f45a8,#93a5ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration-thickness:1px;text-underline-offset:4px}
h1,h2,h3{font-family:"Hahmlet",serif;margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(5vw,16px)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 28px;min-height:60px}
.mark{font-family:"Hahmlet",serif;font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;margin-right:auto}
header.top nav{display:flex;flex-wrap:wrap;gap:0 24px}
header.top nav a{color:var(--mute);text-decoration:none;font-size:15px;padding:10px 0}
header.top nav a:hover,header.top nav a.cur{color:var(--ink)}

.hero{padding-block:clamp(72px,12vw,168px)}
.feature{margin:0;max-width:980px}
.feature blockquote{margin:0}
.feature .q{font-family:"Hahmlet",serif;font-weight:300;font-size:clamp(32px,4.8vw,60px);line-height:1.32;letter-spacing:-.03em;margin:0;text-wrap:balance}
.feature figcaption{margin-top:28px;color:light-dark(#4a4f57,#b8bcc4);font-size:15px;text-align:center}
.feature figcaption b{font-weight:400}
.feature .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;background:var(--soft)}
.feature .lyric .q{white-space:pre-line}

section.part{padding-block:clamp(56px,7vw,96px);border-top:1px solid var(--rule)}
.part .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px 64px}
.rail{align-self:start;position:sticky;top:92px}
.rail h2{font-weight:500;font-size:clamp(30px,3.2vw,40px);line-height:1.1;letter-spacing:-.02em}
.rail p{color:var(--mute);font-size:15px;margin:12px 0 0;max-width:16em}

.list{border-top:1px solid var(--ink);margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 32px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.list h3{font-weight:500;font-size:20px;line-height:1.4;letter-spacing:-.01em}
.list .by{color:var(--mute);font-size:15px}
.list .line{grid-column:1 / -1;margin:0;font-size:15.5px;color:var(--ink);max-width:40em}
.list.wide li{grid-template-columns:minmax(0,4fr) minmax(0,6fr) auto}
.list.wide .line{grid-column:auto}
.st{font-size:14px;white-space:nowrap;color:var(--mute)}
.st.live{color:var(--acc)}
.st.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}

.mail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.mail .addr{color:var(--ink);text-decoration:none;font-size:15px;overflow-wrap:anywhere}
.mail .addr:hover{color:var(--acc)}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font:500 15px "IBM Plex Sans KR",sans-serif;min-height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.more:hover{background:color-mix(in srgb,var(--soft) 80%,var(--ink) 8%)}
.more::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.more[aria-expanded=true]::after{transform:translateY(2px) rotate(-135deg)}
.more[hidden]{display:none}
.cue{display:none}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.sample{color:var(--mute);font-size:13px;margin-top:20px}
footer{border-top:1px solid var(--rule);padding-block:28px;color:var(--mute);font-size:14px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px 24px}

@media(max-width:860px){.hero .wrap,.part .wrap{grid-template-columns:minmax(0,1fr)}.rail{position:static}.list.wide li{grid-template-columns:minmax(0,1fr) auto}.list.wide .line{grid-column:1 / -1}.list.wide .st{grid-row:1;grid-column:2}}
@media(max-width:560px){header.top nav{gap:0 16px}.list li{grid-template-columns:minmax(0,1fr)}.list h3{font-size:18px}}
@media(max-width:600px){
html{scroll-snap-type:y proximity;scroll-padding-top:0}
header.top{display:none}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;position:relative;padding-block:72px 120px;scroll-snap-align:start}
.hero .wrap{width:100%}
.feature .q{font-size:clamp(28px,8.4vw,38px)}
.cue{display:flex;flex-direction:column;align-items:center;gap:10px;position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);color:var(--mute);font-size:13px;text-decoration:none;padding:8px 16px}
.cue i{display:block;width:1.5px;height:40px;background:var(--ink);animation:drop 2s ease-in-out infinite}
section.part{border:0;min-height:100svh;display:flex;align-items:center;padding:16px 12px;scroll-snap-align:start}
section.part>.wrap{width:100%;background:var(--soft);border:1px solid transparent;border-radius:18px;padding:30px 20px 26px;opacity:.38;transform:scale(.95);transition:opacity .45s ease,transform .45s ease,border-color .45s ease,background-color .45s ease}
section.part.active>.wrap{opacity:1;transform:none;background:var(--bg);border-color:var(--ink)}
.rail h2{font-size:32px}
.list{border-top-color:var(--rule)}
footer{scroll-snap-align:end}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cue i{animation:none}section.part>.wrap{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#top">axisnotb</a>
  <nav aria-label="주 메뉴">
    <a href="#books">책</a><a href="#music">음악</a><a href="#places">장소</a>
  </nav>
</div></header>

<main id="top">
<section class="hero"><div class="wrap">
  <div id="feature" class="feature"></div>
</div>
  <a class="cue" href="#books"><span>아래로</span><i aria-hidden="true"></i></a>
</section>

<section class="part" id="books"><div class="wrap">
  <div class="rail"><h2>책</h2><p>읽으면 좀 나아질까</p></div>
  <div><ul class="list" id="bookList"></ul><button type="button" class="more" data-k="books" aria-expanded="false">더보기</button>
</div>
</div></section>

<section class="part" id="music"><div class="wrap">
  <div class="rail"><h2>음악</h2><p>기분을 바꾸는 마법</p></div>
  <div><ul class="list" id="musicList"></ul><button type="button" class="more" data-k="music" aria-expanded="false">더보기</button></div>
</div></section>

<section class="part" id="places"><div class="wrap">
  <div class="rail"><h2>장소</h2><p>되돌릴 수 없는 시간</p></div>
  <div><ul class="list" id="placeList"></ul><button type="button" class="more" data-k="places" aria-expanded="false">더보기</button></div>
</div></section>


</main>

<footer><div class="wrap foot">
  <span class="mail"><a class="addr" id="addr" href="#top">cjhaha (at) gmail.com</a></span>
</div></footer>

<script src="content.js"></script>
<script>
{
const data={books:BOOKS,music:MUSIC,places:PLACES};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row=x=>`<li><h3>${esc(x.t)}</h3><span class="by">${esc(x.b)}</span>${x.l?`<p class="line">${esc(x.l)}</p>`:""}</li>`;
const LIMIT=3;
const lists={books:["bookList",row],music:["musicList",row],places:["placeList",row]};
const open={};
function render(k){const [id,fn]=lists[k],items=data[k];$(id).innerHTML=(open[k]?items:items.slice(0,LIMIT)).map(fn).join("");
 const b=document.querySelector(`.more[data-k="${k}"]`);b.hidden=items.length<=LIMIT;b.setAttribute("aria-expanded",open[k]?"true":"false");b.textContent=open[k]?"접기":"더보기"}
Object.keys(lists).forEach(render);
document.querySelectorAll(".more").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;open[k]=!open[k];render(k);if(!open[k])$(k).scrollIntoView({block:"start"})}));
const features=QUOTES;
// 날짜(방문자 기기 기준)마다 하나씩 차례로 바뀜
const now=new Date(),day=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5);
const f=features[day%features.length];
$("feature").innerHTML=f.type==="photo"
 ?`<figure class="feature"><img class="ph" src="${esc(f.src)}" alt="${esc(f.title)}"><figcaption>-${esc(f.title)}, ${esc(f.by)}-</figcaption></figure>`
 :`<figure class="feature ${f.type}"><blockquote><p class="q">${esc(f.text)}</p></blockquote><figcaption>-${esc(f.title)}, ${esc(f.by)}-</figcaption></figure>`;

// 주소를 조각으로 나눠 두었다가 화면에서만 합쳐, 수집 프로그램이 원문에서 읽기 어렵게 함
const parts=["cjhaha","gmail","com"],email=parts[0]+"@"+parts[1]+"."+parts[2];
const a=$("addr");a.textContent=email;a.href="mailto:"+email;

const links=[...document.querySelectorAll("header.top nav a")];
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)links.forEach(l=>l.classList.toggle("cur",l.getAttribute("href")==="#"+en.target.id))})},{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("section.part").forEach(s=>io.observe(s));
// 모바일: 화면 가운데에 들어온 카드를 강조
const hi=new IntersectionObserver(es=>{es.forEach(en=>en.target.classList.toggle("active",en.isIntersecting))},{rootMargin:"-35% 0px -35% 0px"});
document.querySelectorAll("section.part").forEach(s=>hi.observe(s));
}
</script>

</body>
</html>
